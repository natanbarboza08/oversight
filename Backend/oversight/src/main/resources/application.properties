server.port=${SERVER_PORT:${PORT:8080}}
server.error.include-message=never
server.error.include-stacktrace=never

spring.config.import=optional:file:.env[.properties]
spring.application.name=oversight-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.max-lifetime=240000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.sql.init.mode=${DB_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema.sql

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.cors.origins=${CORS_ORIGINS}
app.admin.nome=${ADMIN_NOME:Administrador}
app.admin.email=${ADMIN_EMAIL}
app.admin.senha=${ADMIN_PASSWORD}
app.upload.max-linhas=${UPLOAD_MAX_LINHAS:5000}
app.etl.url=${ETL_URL}
app.etl.key=${ETL_KEY}

logging.level.root=INFO
logging.level.com.senai.oversight=INFO
